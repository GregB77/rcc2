<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paramètres RCC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="nav">
        <a href="rcc_param.html">Paramètres</a>
        <a href="sim_rcc.html">Simulation</a>
    </div>

    <h1>Paramètres RCC</h1>

    <table class="table">
        <thead>
            <tr>
                <th>Paramètre</th>
                <th>Valeur</th>
            </tr>
        </thead>
        <tbody id="paramTable"></tbody>
    </table>

    <button onclick="saveAll()">Enregistrer</button>

</div>

<script src="rcc.js"></script>

<script>
const params = loadParams();

const labels = {
    illAncienneteMini: 'ILL - Ancienneté minimale (mois)',
    illTaux010: 'ILL - Taux 0-10 ans',
    illTaux10Plus: 'ILL - Taux >10 ans',
    ilcAncienneteMini: 'ILC - Ancienneté mini',
    ilcMaj50_55: 'ILC - Majoration 50-55',
    ilcMaj55_60: 'ILC - Majoration 55-60',
    ilcPlafond: 'ILC - Plafond',
    passAnnuel: 'PASS annuel',
    mobiliteSupraCoef: 'Mobilité - Coef supra',
    mobilitePlafondMois: 'Mobilité - Plafond mois',
    mobilitePlafondEuro: 'Mobilité - Plafond €',
    cfcPlafondMois: 'CFC - Plafond mois',
    cfcPlafondEuro: 'CFC - Plafond €',
    cfcDureeMax: 'CFC - Durée max',
    cfcTaux: 'CFC - Taux rémunération'
};

const tbody = document.getElementById('paramTable');

Object.keys(labels).forEach(key => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>${labels[key]}</td>
        <td>
            <input type="number" step="0.01" id="${key}" value="${params[key]}">
        </td>
    `;

    tbody.appendChild(tr);
});

function saveAll() {
    Object.keys(labels).forEach(key => {
        params[key] = Number(document.getElementById(key).value);
    });

    saveParams(params);

    alert('Paramètres enregistrés');
}
</script>

</body>
</html>
